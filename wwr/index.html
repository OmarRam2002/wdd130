<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Home</title>
    <meta name="description" content="This website is the main Home page">
    <meta name="author" content="Omar Ramirez">
</head>

<body>


    <header>
        <img src="images/logo.png" alt="company logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="hero">
        <img src="images/background.jpg" alt="Rafting Image" class="background rafting">
        <h1>White Water Rafting</h1>

        <form action="about.html" class="signup-form">
            <fieldset class="form-item">
                <legend>Sign Up</legend>
                <label class="signup">Name
                    <input type="text" id="fullname" name="fullname" required></label>

                <label class="signup">Email
                    <input type="email" id="useremail" name="useremail" required></label>
                <button type="submit" class="signmeup">Sign me up</button>
            </fieldset>
        </form>
        <section class="employees-section moreinfo">
            <div class="adventures trips1">
                <div>
                    <figure>
                        <img src="images/lake.jpg" alt="river">
                        <h2>Purpose</h2>
                        <p>To provide safe, thrilling, and accessible river adventures, utilizing
                            expert
                            guides to deliver
                            memorable outdoor experiences, foster teamwork, and promote
                            environmental
                            stewardship.</p>
                    </figure>
                </div>
                <div>
                    <figure>
                        <img src="images/biking.jpg" alt="beach">
                        <h2>Offerings</h2>
                        <p>Guided, all-inclusive whitewater and scenic rafting trips, supplying all
                            necessary safety
                            gear—helmets, life jackets (PFDs), paddles, and wetsuits—along with
                            expert,
                            trained guides for
                            navigation.
                        </p>
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>©2026 ✎ Whitewater Rafting ✎ Omar Ramirez</p>
        <nav class="socialmedia">
            <a href="http://facebook.com">
                <img src="images/facebook.png" alt="facebook icon">
            </a>
            <a href="http://linkedin.com">
                <img src="images/linkedin.png" alt="linkedin icon">
            </a>
            <a href="http://instagram.com">
                <img src="images/instagram.png" alt="instagram icon">
            </a>
        </nav>
    </footer>


</body>

</html>
